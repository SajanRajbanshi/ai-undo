name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The whole store is a git repository, so the runner's git version is
      # part of the contract (>= 2.26 for --pathspec-from-file).
      - name: Record git version
        run: git --version

      - run: npm ci

      - run: npm run lint

      - run: npm run check-types

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (real git, real filesystem)
        run: npm run test:integration

      # §13.4 — catches order-of-magnitude regressions, not exact milliseconds.
      # The budgets carry a CI multiplier; see test/perf/walk.test.ts.
      - name: Performance harness
        run: npm run test:perf

      - name: Extension host tests
        # A headless extension host needs a virtual display on Linux.
        run: ${{ matrix.os == 'ubuntu-latest' && 'xvfb-run -a npm run test:suite' || 'npm run test:suite' }}

      - name: Package
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.os }}
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Needed to attach the VSIX to the GitHub release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package

      # Always runs, and needs no account: anyone can download the VSIX and
      # install it by hand. This is the distribution channel that works before
      # either registry is set up, and the fallback if one is ever unavailable.
      - name: Attach the VSIX to the GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.vsix \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" ./*.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Both registries are optional and independent: a missing token skips
      # that one rather than failing the release. Tagging therefore works today,
      # with tokens added whenever the accounts exist.
      - name: Publish to Open VSX (Cursor, Antigravity, Windsurf, VSCodium)
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not set; skipping Open VSX."
            exit 0
          fi
          # Read from the manifest rather than written out: the namespace must
          # equal `publisher` exactly, and a second hardcoded copy is the kind
          # that silently rots across a rename.
          PUBLISHER=$(node -p "require('./package.json').publisher")
          # Idempotent. The namespace only needs creating once and errors on a
          # second attempt, so a failure here is expected on every release but
          # the first.
          npx ovsx create-namespace "$PUBLISHER" || echo "Namespace $PUBLISHER already exists; continuing."
          npx ovsx publish ./*.vsix --pat "$OVSX_PAT"
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Publish to the VS Code Marketplace
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not set; skipping the VS Code Marketplace."
            exit 0
          fi
          npx vsce publish --no-dependencies --pat "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
