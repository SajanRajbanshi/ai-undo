name: Bug report
description: Something was tracked wrongly, restored wrongly, or not tracked at all.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        When this extension goes wrong it usually goes wrong *silently* — a file
        that should have been tracked and wasn't. The output channel is the
        primary diagnostic, so please attach it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Ran `claude` and asked it to ...
        2. Three files appeared in AI Changes
        3. Clicked Reject on src/app.ts
        4. ...
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: macOS 15.5 / Ubuntu 24.04 / Windows 11
    validations:
      required: true

  - type: input
    id: vscode
    attributes:
      label: VS Code version
      description: Help → About, or `code --version`
    validations:
      required: true

  - type: input
    id: git
    attributes:
      label: git version
      description: Output of `git --version`
    validations:
      required: true

  - type: input
    id: agent
    attributes:
      label: Which coding agent
      placeholder: Claude Code 2.x / opencode / other
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Output channel
      description: >
        Command Palette → "Local File Change Tracker: Show Log". Set the level
        to Debug and reproduce first if you can. Redact any paths or content you
        would rather not share.
      render: shell

  - type: checkboxes
    id: confirmations
    attributes:
      label: Please confirm
      options:
        - label: This is a single-folder workspace (multi-root is not supported).
        - label: I am not using Remote/SSH/WSL/Codespaces (untested in v1).
